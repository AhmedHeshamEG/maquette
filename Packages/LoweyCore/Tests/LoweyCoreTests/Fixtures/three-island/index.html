<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Low-poly island</title>
  <style>body { margin: 0; overflow: hidden; background: #87ceeb; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1));
const sun = new THREE.DirectionalLight(0xfff0dd, 2);
sun.name = 'Sun';
sun.position.set(5, 10, 3);
scene.add(sun);

// The island spins slowly; the trees ride on it.
const island = new THREE.Group();
island.name = 'Island';
scene.add(island);
const ground = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3, 0.8, 7),
  new THREE.MeshStandardMaterial({ color: 0x7cb342, flatShading: true, roughness: 0.9 }));
ground.name = 'Ground';
island.add(ground);
const trees = new THREE.InstancedMesh(new THREE.ConeGeometry(0.3, 1, 5),
  new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true }), 12);
trees.name = 'Trees';
const place = new THREE.Matrix4();
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2, radius = 1.2 + (i % 3) * 0.4;
  place.makeTranslation(Math.cos(angle) * radius, 0.9, Math.sin(angle) * radius);
  trees.setMatrixAt(i, place);
}
island.add(trees);

// The sea is a shader: waves in the vertex shader, colour by height.
const sea = new THREE.Mesh(new THREE.PlaneGeometry(14, 14, 48, 48), new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, deep: { value: new THREE.Color(0x0b4f8a) }, shallow: { value: new THREE.Color(0x4fc3f7) } },
  vertexShader: `uniform float time; varying float h;
    void main() { vec3 p = position; p.z += 0.15 * sin(p.x * 1.5 + time * 2.0) * cos(p.y * 1.3 + time * 1.4); h = p.z;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
  fragmentShader: `uniform vec3 deep; uniform vec3 shallow; varying float h;
    void main() { gl_FragColor = vec4(mix(deep, shallow, h * 3.0 + 0.5), 1.0); }`,
}));
sea.name = 'Sea';
sea.rotation.x = -Math.PI / 2;
sea.position.y = -0.3;
scene.add(sea);

// A boat bobbing on a clip.
const boat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 0.3), new THREE.MeshStandardMaterial({ color: 0xd84315 }));
boat.name = 'Boat';
boat.position.set(4, -0.15, 0);
scene.add(boat);
const bob = new THREE.AnimationClip('Bob', 2, [
  new THREE.VectorKeyframeTrack('Boat.position', [0, 1, 2], [4, -0.15, 0, 4, 0.05, 0, 4, -0.15, 0]),
]);
const mixer = new THREE.AnimationMixer(scene);
mixer.clipAction(bob).play();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();
  mixer.update(delta);
  island.rotation.y += delta * 0.3;
  sea.material.uniforms.time.value = clock.elapsedTime;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
