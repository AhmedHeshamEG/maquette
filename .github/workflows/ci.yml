# CI (CONTEXT §7: fast and cheap). One run per change: pull requests, and main after a merge (the commit a phase is
# tagged on). A `changes` job decides what a change can affect:
#
#   docs only (*.md, docs/, LICENSE) → nothing builds; `CI result` passes
#   LoweyCore only                   → lint + Linux tests (no simulator)
#   LoweyEngine                      → + Metal renderer render tests (goldens) and everything above it
#   LoweyFeatures / App / UI tests   → + feature tests, app build and UI smoke tests
#   main (every merge)               → everything, so a tagged commit always passed the UI tests
#
# The app job runs beside the Engine and Feature jobs (it builds the same sources itself) and builds once for
# testing; four UI shards then run a quarter of the suite each, balanced by Tools/ui-shards.py (a draft pull request
# runs only the areas it changed). Every pull request also gets an installable Maquette.ipa. `CI result` is the single required check: branch protection and auto-merge
# wait on it, and it is green when everything that had to run passed (skipped jobs are fine).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft's run skips the App Store walk and most UI tests, so marking it ready runs everything.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: Xcode 27.0 (iPadOS 27 SDK) on GitHub's xcode-27 runner image.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.route.outputs.code }}
      core: ${{ steps.route.outputs.core }}
      engine: ${{ steps.route.outputs.engine }}
      features: ${{ steps.route.outputs.features }}
      tools: ${{ steps.route.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
            core:
              - 'Packages/LoweyCore/**'
              - 'Packages/HmmKit/**'
              - 'Packages/XAtlas/**'
              - 'Packages/InstantMeshes/**'
              - 'Packages/Jolt/**'
              - 'Tools/godot/**'
              - 'Tools/check_look_render.py'
              - 'Tools/check_threejs.mjs'
              - '.swiftlint.yml'
              - '.swiftformat'
              - '.github/workflows/ci.yml'
            engine:
              - 'Packages/LoweyEngine/**'
              - 'Packages/LoweyCore/Sources/**'
              - 'Packages/XAtlas/Sources/**'
              - 'Packages/InstantMeshes/Sources/**'
              - 'Packages/Jolt/Sources/**'
              - 'Packages/HmmKit/Sources/**'
              - '.github/workflows/ci.yml'
            features:
              - 'Packages/LoweyFeatures/**'
              - 'Packages/LoweyEngine/Sources/**'
              - 'Packages/LoweyCore/Sources/**'
              - 'Packages/XAtlas/Sources/**'
              - 'Packages/InstantMeshes/Sources/**'
              - 'Packages/Jolt/Sources/**'
              - 'Packages/HmmKit/Sources/**'
              - 'App/**'
              - 'AppUITests/**'
              - 'project.yml'
              - 'Config/**'
              - 'Tools/check-feature-boundaries.py'
              - 'Tools/pick-simulator.py'
              - 'Tools/ui-shards.py'
              - '.github/workflows/ci.yml'
            tools:
              - 'Tools/**'
              - 'schemas/**'
              - 'skills/**'
              - 'docs/LAYOUT.md'
              - 'AppUITests/LayoutWalk.swift'
              - 'App/Resources/**'
              - 'Packages/LoweyFeatures/Sources/**'
              - 'Packages/LoweyCore/Sources/**'
              - '.github/workflows/ci.yml'
      - name: Route
        id: route
        run: |
          # Every merge to main (and a manual run) checks everything.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            for key in code core engine features tools; do echo "$key=true" >> "$GITHUB_OUTPUT"; done
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "core=${{ steps.filter.outputs.core }}" >> "$GITHUB_OUTPUT"
            echo "engine=${{ steps.filter.outputs.engine }}" >> "$GITHUB_OUTPUT"
            echo "features=${{ steps.filter.outputs.features }}" >> "$GITHUB_OUTPUT"
            echo "tools=${{ steps.filter.outputs.tools }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    name: Lint (SwiftLint + SwiftFormat)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The held list agrees with Held.swift (CONTEXT §D.25)
        run: python3 Tools/check_held.py
      - name: SwiftFormat
        run: |
          curl -sSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -q swiftformat.zip -d swiftformat-bin
          chmod +x swiftformat-bin/swiftformat_linux
          swiftformat-bin/swiftformat_linux --lint . --reporter github-actions-log
      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --strict --reporter github-actions-logging

  core-tests:
    name: LoweyCore tests + coverage (Linux)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/LoweyCore/.build
          key: core-build-${{ hashFiles('Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift', 'Packages/XAtlas/Package.swift', 'Packages/InstantMeshes/Package.swift', 'Packages/Jolt/Package.swift') }}-${{ github.sha }}
          restore-keys: core-build-${{ hashFiles('Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift', 'Packages/XAtlas/Package.swift', 'Packages/InstantMeshes/Package.swift', 'Packages/Jolt/Package.swift') }}-
      - name: Test (journal, save → load round trips, package upgrades, Look system, geometry)
        working-directory: Packages/LoweyCore
        # Serial: parallel runs corrupt the coverage profile.
        env:
          ACCEPTANCE_DIR: ${{ github.workspace }}/acceptance
        run: swift test --enable-code-coverage
      - name: Keep the exported files for the interop checks
        uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: acceptance
          retention-days: 7
      - name: Coverage gate (≥ 80% lines)
        working-directory: Packages/LoweyCore
        run: |
          PROFILE=$(dirname "$(swift test --show-codecov-path)")/default.profdata
          BINARY=$(find .build -name 'LoweyCorePackageTests.xctest' -type f | head -1)
          llvm-cov report "$BINARY" -instr-profile="$PROFILE" -ignore-filename-regex='Tests|\.build|HmmKit|XAtlas|InstantMeshes|Jolt' | tee coverage.txt
          COVERAGE=$(grep TOTAL coverage.txt | awk '{print $10}' | tr -d '%')
          echo "Line coverage: $COVERAGE%"
          echo "### LoweyCore line coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$COVERAGE" 'BEGIN { exit !(c >= 80) }'
      - name: SPIKE (U4) lighten a 1.3 million triangle sculpt in a release build
        working-directory: Packages/LoweyCore
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter MeshSimplifyTests 2>&1 | tee spike.txt
          grep SPIKE spike.txt >> "$GITHUB_STEP_SUMMARY"
      - name: SPIKE (U6) clean topology on a 500 000 triangle sculpt, and a cage on 50 000, in a release build
        working-directory: Packages/LoweyCore
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter QuadRemeshTests 2>&1 | tee spike-u6.txt
          grep SPIKE spike-u6.txt >> "$GITHUB_STEP_SUMMARY"

      - name: SPIKE (P1) Jolt's own tests and a 500-body stack in a release build
        working-directory: Packages/Jolt
        shell: bash
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee spike-p1.txt
          grep JOLT_SPIKE spike-p1.txt >> "$GITHUB_STEP_SUMMARY"
      - name: SPIKE (P1) physics in LoweyCore in a release build (fluids, the stairs ragdoll)
        working-directory: Packages/LoweyCore
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter PhysicsSpikeTests 2>&1 | tee spike-p1-core.txt
          grep SPIKE spike-p1-core.txt >> "$GITHUB_STEP_SUMMARY"

  godot:
    name: Rigged, real and made characters play in Godot 4.3
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance
          path: acceptance
      - name: Godot opens the rigged tail (glTF and FBX), finds its skeleton and skin, and its bones move when it plays
        run: |
          set -o pipefail
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          for file in tail.glb tail.fbx; do
            ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --script check_skin.gd -- "$GITHUB_WORKSPACE/acceptance/rigged/$file" 2>&1 | tee "godot-$file.log"
            grep -q "MAQUETTE GODOT: .* bones" "godot-$file.log"
            grep "MAQUETTE GODOT" "godot-$file.log" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Godot opens the dropped cube's glTF as a rigid body on a static floor, with its mass and the run as animation
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --script check_physics.gd -- "$GITHUB_WORKSPACE/acceptance/physics/drop.glb" 2>&1 | tee godot-physics.log
          grep -q "MAQUETTE GODOT PHYSICS: .* animated" godot-physics.log
          grep "MAQUETTE GODOT PHYSICS" godot-physics.log >> "$GITHUB_STEP_SUMMARY"
      - name: A made person maps onto Godot's humanoid profile, plays its named clips and carries its face as blend shapes (K1)
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --script check_humanoid.gd -- "$GITHUB_WORKSPACE/acceptance/characters/person.glb" 2>&1 | tee godot-humanoid.log
          grep -q "MAQUETTE GODOT HUMANOID: .* blend shapes" godot-humanoid.log
          grep "MAQUETTE GODOT HUMANOID" godot-humanoid.log >> "$GITHUB_STEP_SUMMARY"
      - name: Dev's greybox level comes in with a static body and its collision for every piece (G1)
        run: |
          set -o pipefail
          mkdir -p Tools/godot/level && cp acceptance/game/level.glb Tools/godot/level/
          ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --import 2>&1 | tail -5
          ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --script check_level.gd -- res://level/level.glb 2>&1 | tee godot-level.log
          grep -q "MAQUETTE GODOT LEVEL: .* static bodies" godot-level.log
          grep "MAQUETTE GODOT LEVEL" godot-level.log >> "$GITHUB_STEP_SUMMARY"
      - name: A dog's sprite sheet plays in an AnimatedSprite2D from four directions (K1)
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path Tools/godot --script check_sprites.gd -- "$GITHUB_WORKSPACE/acceptance/sprites/dog.png" "$GITHUB_WORKSPACE/acceptance/sprites/dog.json" 2>&1 | tee godot-sprites.log
          grep -q "MAQUETTE GODOT SPRITES: .* every frame drawn" godot-sprites.log
          grep "MAQUETTE GODOT SPRITES" godot-sprites.log >> "$GITHUB_STEP_SUMMARY"

  look-shader:
    name: The Ink Look renders in Godot 4.3 from its exported shader (golden)
    needs: core-tests
    runs-on: ubuntu-latest
    # The same Ubuntu and Mesa (llvmpipe) the golden was recorded with.
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance
          path: acceptance
      - name: Godot, a virtual screen and software OpenGL
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0             libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 libasound2t64 libpulse0 curl unzip ca-certificates python3
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
      - name: Godot draws a sphere and a cube with the exported Ink material and its outline pass; the frame matches the golden
        shell: bash
        run: |
          set -o pipefail
          cp -r acceptance/look-shader Tools/godot/look
          xvfb-run -a -s '-screen 0 1280x720x24' ./Godot_v4.3-stable_linux.x86_64 --rendering-method gl_compatibility             --rendering-driver opengl3 --resolution 1280x720 --path Tools/godot --script render_look.gd             -- res://look/maquette_ink.tres "$PWD/look-render.png" 2>&1 | tee godot-look.log
          grep -q "MAQUETTE GODOT LOOK: rendered 1280x720" godot-look.log
          python3 Tools/check_look_render.py look-render.png Tools/godot/golden/ink-look.png look-diff.png | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the render and its difference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-render
          path: |
            look-render.png
            look-diff.png
          retention-days: 7

  threejs:
    name: SPIKE (X1) the web folder in three.js 0.170 (node and Chromium)
    needs: core-tests
    runs-on: ubuntu-latest
    # Node and a Chromium that draws WebGL with SwiftShader.
    container: mcr.microsoft.com/playwright:v1.48.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance
          path: acceptance
      - name: three.js, Playwright and the glTF Validator, pinned
        run: |
          mkdir -p /tmp/threecheck && cd /tmp/threecheck
          npm init -y > /dev/null
          npm install --silent three@0.170.0 playwright@1.48.2 gltf-validator@2.0.0-dev.3.10
          cp "$GITHUB_WORKSPACE/Tools/check_threejs.mjs" "$GITHUB_WORKSPACE/Tools/validate_gltf.mjs" .
      - name: GLTFLoader and ObjectLoader read the folder alike, and as Maquette wrote it
        run: |
          set -o pipefail
          cd /tmp/threecheck
          node check_threejs.mjs structure "$GITHUB_WORKSPACE/acceptance/threejs/night-room" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Chromium plays the folder and draws what Maquette sees
        run: |
          set -o pipefail
          cd /tmp/threecheck
          HOME=/root node check_threejs.mjs render "$GITHUB_WORKSPACE/acceptance/threejs/night-room" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A three.js project plays as in the sandbox and the recorder says what Maquette's tests read
        run: |
          set -o pipefail
          cd /tmp/threecheck
          cp "$GITHUB_WORKSPACE/Tools/record_threejs.mjs" .
          fixture="$GITHUB_WORKSPACE/Packages/LoweyCore/Tests/LoweyCoreTests/Fixtures/three-island"
          HOME=/root node record_threejs.mjs "$GITHUB_WORKSPACE/acceptance/threejs/recorder" "$fixture" /tmp/island.json "$fixture/recording.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The web GLB passes the Khronos glTF Validator
        run: |
          cd /tmp/threecheck
          node validate_gltf.mjs "$GITHUB_WORKSPACE/acceptance/threejs/night-room/scene.glb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threejs-render
          path: acceptance/threejs/night-room/rendered.png
          retention-days: 7

  interop:
    name: Print files (slicer check) + Blender package + painted glTF (Blender ${{ matrix.blender }})
    needs: core-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.23", "5.2.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance
          path: acceptance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The M3 block's STL and 3MF are watertight (trimesh, as a slicer checks)
        if: matrix.blender == '5.2.1'
        run: |
          pip install --quiet trimesh networkx lxml
          python Tools/check_print_files.py acceptance
      - name: The guests' files open in their people's tools (IFC in IfcOpenShell, DXF in ezdxf, PDFs, the jar and lid watertight)
        if: matrix.blender == '5.2.1'
        run: |
          pip install --quiet ifcopenshell ezdxf pypdf trimesh networkx lxml
          python Tools/check_guest_files.py acceptance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Blender ${{ matrix.blender }}
        run: |
          MINOR="${{ matrix.blender }}"; MINOR="${MINOR%.*}"
          curl -sSL "https://download.blender.org/release/Blender$MINOR/blender-${{ matrix.blender }}-linux-x64.tar.xz" | tar -xJ
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 > /dev/null
      - name: setup_maquette.py builds the .blend and renders a frame
        working-directory: acceptance/blender-package
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/blender-${{ matrix.blender }}-linux-x64/blender" -b --factory-startup --python setup_maquette.py -- --check 2>&1             | tee blender.log | grep -E "MAQUETTE|Error|Traceback" || true
          grep -q "MAQUETTE: rendered" blender.log
          test -s renders/check.png
          ls *.blend
      - name: The painted glTF passes the Khronos glTF Validator
        if: matrix.blender == '5.2.1'
        run: |
          npm install --no-save --silent gltf-validator@2.0.0-dev.3.10
          node Tools/validate_gltf.mjs acceptance/painted/painted.glb
          # U7: every map (metallic-roughness, emissive, normal with tangents) of a painted, smudged, masked crate.
          node Tools/validate_gltf.mjs acceptance/textured/textured.glb
      - name: The painted glTF shows its paint in Blender
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/blender-${{ matrix.blender }}-linux-x64/blender" -b --factory-startup --python-exit-code 1             --python Tools/check_painted_render.py -- acceptance/painted/painted.glb acceptance/painted/render.png 2>&1             | tee painted.log | grep -E "MAQUETTE|Error|Traceback" || true
          grep -q "MAQUETTE: paint shows" painted.log
      - name: The rigged tail plays in Blender (glTF and our own FBX)
        run: |
          set -o pipefail
          for file in tail.glb tail.fbx; do
            "$GITHUB_WORKSPACE/blender-${{ matrix.blender }}-linux-x64/blender" -b --factory-startup --python-exit-code 1               --python Tools/check_rigged_import.py -- "acceptance/rigged/$file" 6 2>&1 | tee rigged.log | grep -E "MAQUETTE|Error|Traceback" || true
            grep -q "MAQUETTE: rigged" rigged.log
          done
      - name: A painted Blender package builds and renders
        working-directory: acceptance/painted-blender
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/blender-${{ matrix.blender }}-linux-x64/blender" -b --factory-startup --python setup_maquette.py -- --check 2>&1             | tee blender.log | grep -E "MAQUETTE|Error|Traceback" || true
          grep -q "MAQUETTE: rendered" blender.log
          test -s renders/check.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-check-${{ matrix.blender }}
          path: |
            acceptance/blender-package/renders
            acceptance/painted-blender/renders
            acceptance/painted/render.png
          retention-days: 7

  tools:
    name: Laptop tools (hmm-bridge, MCP v2)
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/lowey/pyproject.toml
      - name: Blob measurements match the drawing (trace.json codegen)
        run: python Tools/gen-blob-measurements.py --check
      - name: The Kit matches its curation, is CC0 and fits the budget
        run: python Tools/fetch-kit.py check
      - name: The Scene Script v3 schema matches its generator
        run: python Tools/gen-script-schema.py --check
      - name: Every chrome string is in the String Catalog, in Italian and Arabic
        run: python Tools/strings.py check
      - name: The bridge's reach table matches BridgeCoverage (M12)
        run: python Tools/gen-coverage.py --check
      - name: The layout walk matches docs/LAYOUT.md
        run: python Tools/layout_walk.py --check
      - name: Test against a fake iPad bridge (the 16 MCP tools, the CLI, the evals harness)
        working-directory: Tools/lowey
        run: |
          pip install -e ".[test]"
          pytest -q
      - name: The skill's tool reference is generated from the MCP server
        run: python Tools/gen-skill-tools.py --check

  engine:
    name: LoweyEngine (Metal renderer) build + render tests
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: engine-dd-${{ hashFiles('Packages/LoweyEngine/Package.swift', 'Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift') }}-${{ github.sha }}
          restore-keys: engine-dd-${{ hashFiles('Packages/LoweyEngine/Package.swift', 'Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift') }}-
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and test (golden images at every tier, picking, skinning, preview = export, hover point, benchmark)
        working-directory: Packages/LoweyEngine
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/goldens"
          # A second attempt when the test runner itself hangs (R33); per-test retries can't recover that.
          for attempt in 1 2; do
            rm -rf "$RUNNER_TEMP/Engine.xcresult"
            TEST_RUNNER_GOLDEN_OUTPUT="$RUNNER_TEMP/goldens" xcodebuild test \
              -scheme LoweyEngine -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/Engine.xcresult" \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -retry-tests-on-failure -test-iterations 3 \
              -skipPackagePluginValidation -IDEBuildingContinueBuildingAfterErrors=YES \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              | tee "$RUNNER_TEMP/engine.log" | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
            grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/engine.log" && exit 0
            echo "::warning::Engine tests failed on attempt $attempt"
          done
          exit 1
      - name: Collect renders
        if: always()
        run: |
          mkdir -p renders
          cp "$RUNNER_TEMP"/goldens/*.png renders/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Engine.xcresult" --output-path renders || true
          ls renders | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-renders
          path: renders
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-log
          path: ${{ runner.temp }}/engine.log
          retention-days: 7

  features:
    name: LoweyFeatures build + tests (iPad simulator)
    needs: changes
    if: needs.changes.outputs.features == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: features-dd-${{ hashFiles('Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: features-dd-${{ hashFiles('Packages/*/Package.swift') }}-
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Feature boundaries (no feature reaches into another)
        run: python3 Tools/check-feature-boundaries.py
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: Packages/LoweyFeatures
        run: |
          set -o pipefail
          xcodebuild test -scheme LoweyFeatures -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -skipPackagePluginValidation -IDEBuildingContinueBuildingAfterErrors=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | tee "$RUNNER_TEMP/features.log" | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/features.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: features-log
          path: ${{ runner.temp }}/features.log
          retention-days: 7

  app:
    name: iPad app build (for the UI tests)
    needs: [changes, lint]
    if: needs.changes.outputs.features == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: DerivedData
          key: app-dd-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: app-dd-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}-
      - name: Install XcodeGen and the Metal toolchain
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: xcodegen generate
      # Built once for every simulator; the UI test shards run it without building.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Lowey.xcodeproj -scheme Lowey -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: |\*\* " || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Pack the build
        run: tar -cf ui-build.tar -C DerivedData Build/Products
      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui-build.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  ui:
    name: UI smoke tests (${{ matrix.shard }} of 4)
    needs: app
    runs-on: xcode-27
    # A shard is about a quarter of the suite (~16 min); the second attempt has to fit too.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-build
      - name: Unpack the build
        run: mkdir -p DerivedData && tar -xf ui-build.tar -C DerivedData
      # A draft pull request runs only the tests of the areas it changed (Tools/ui-shards.py); ready, main and a
      # manual run run everything.
      - name: Pick this shard's tests
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate \
              --jq '.[].filename' > changed.txt
            ARGS=$(python3 Tools/ui-shards.py --shards 4 --shard ${{ matrix.shard }} --changed changed.txt)
          else
            ARGS=$(python3 Tools/ui-shards.py --shards 4 --shard ${{ matrix.shard }})
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Pick an iPad simulator
        if: steps.tests.outputs.args != ''
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      # The first test used to pay for a cold simulator: its first UI query could hang past the five-minute allowance,
      # which fails the whole first attempt (D-216).
      - name: Boot the simulator
        if: steps.tests.outputs.args != ''
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Run the UI smoke tests
        if: steps.tests.outputs.args != ''
        run: |
          set -o pipefail
          XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name "*.xctestrun" | head -1)
          # Each test gets up to three tries and the run a second attempt: the simulator now and then fails to
          # terminate the app or stops answering a UI query (R33). The second attempt runs only what failed.
          ARGS="${{ steps.tests.outputs.args }}"
          for attempt in 1 2; do
            rm -rf TestResults.xcresult
            xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=${{ steps.sim.outputs.udid }}" \
              -resultBundlePath TestResults.xcresult -collect-test-diagnostics never -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 300 -retry-tests-on-failure -test-iterations 3 \
              $ARGS | tee xcodebuild.log | grep -E "error:|warning: |Test Case|Executed|\*\* " || true
            grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*\|\*\* TEST SUCCEEDED \*\*" xcodebuild.log && exit 0
            echo "::warning::UI smoke tests failed on attempt $attempt"
            FAILED=$(python3 Tools/ui-shards.py --failed xcodebuild.log)
            [ -n "$FAILED" ] && ARGS="$FAILED"
          done
          exit 1
      - name: iPhone 6.9" App Store screenshot (the face companion)
        if: success() && github.event_name != 'pull_request' && matrix.shard == 1
        run: |
          set -o pipefail
          PHONE=$(python3 Tools/pick-simulator.py --iphone)
          XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name "*.xctestrun" | head -1)
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$PHONE" \
            -resultBundlePath PhoneScreenshots.xcresult -only-testing:LoweyUITests/ScreenshotTests/testIPhoneCompanion \
            | grep -E "error:|Test Case|\*\* " || true
      - name: Export screenshots
        if: always() && steps.tests.outputs.args != ''
        run: |
          mkdir -p attachments app-store
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path attachments || true
          mkdir -p attachments/phone
          xcrun xcresulttool export attachments --path PhoneScreenshots.xcresult --output-path attachments/phone || true
          # The App Store set under readable names.
          python3 - <<'PY'
          import json, pathlib, shutil
          for manifest in pathlib.Path("attachments").glob("**/manifest.json"):
              for test in json.loads(manifest.read_text()):
                  for item in test["attachments"]:
                      name = item["suggestedHumanReadableName"]
                      if name.startswith("AppStore-"):
                          shutil.copy(manifest.parent / item["exportedFileName"], pathlib.Path("app-store") / (name.split("_0_")[0] + ".png"))
          PY
          ls app-store || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.args != ''
        with:
          name: app-store-screenshots-${{ matrix.shard }}
          path: app-store
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.args != ''
        with:
          name: screenshots-${{ matrix.shard }}
          path: attachments
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-${{ matrix.shard }}
          path: xcodebuild.log
          retention-days: 7

  # An installable build of every pull request, to sideload a phase before it's merged and tagged. Main's comes
  # from the Release workflow.
  ipa:
    name: Maquette.ipa for this pull request
    # After the UI tests, so it never takes a Mac from them; `CI result` doesn't wait for it.
    needs: [changes, ui]
    if: github.event_name == 'pull_request' && needs.changes.outputs.features == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and the Metal toolchain
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-release-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
      - name: Generate project
        run: xcodegen generate
      - name: Unsigned device build
        run: |
          set -o pipefail
          xcodebuild build -project Lowey.xcodeproj -scheme Lowey -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Ad-hoc codesign and package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/Lowey.app
          test -d "$APP"
          # Inside out, as in the Release workflow (Sideloadly needs signatures to replace).
          find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - --timestamp=none {} \; 2>/dev/null || true
          find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -exec codesign --force --sign - --timestamp=none {} \; 2>/dev/null || true
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Maquette.ipa Payload
          ls -lh Maquette.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Maquette-pr${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: Maquette.ipa
          retention-days: 14

  appstore:
    name: App Store build (held features held back)
    needs: [changes, lint]
    # On again since 0.29: the store build holds things (CONTEXT §D.25), and this walk proves they're hidden and the rest
    # is there. Ready PRs and main only; a draft skips it.
    if: needs.changes.outputs.features == 'true' && github.event.pull_request.draft != true
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: DerivedData
          key: appstore-dd-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: appstore-dd-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}-
      - name: Install XcodeGen and the Metal toolchain
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      # The App Store configuration holds what project.yml lists (CONTEXT §D.25): the layout walk asserts every row of
      # docs/LAYOUT.md marked held is absent and every other row is there.
      - name: Walk the layout in the App Store configuration
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf AppStore.xcresult
            TEST_RUNNER_MAQUETTE_HELD_CHECK=1 xcodebuild test -project Lowey.xcodeproj -scheme Lowey -configuration AppStore \
              -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData -resultBundlePath AppStore.xcresult \
              -skipPackagePluginValidation -collect-test-diagnostics never -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 -retry-tests-on-failure -test-iterations 3 \
              -only-testing:LoweyUITests/LayoutTests/testHomeControlsAreReachable \
              -only-testing:LoweyUITests/LayoutTests/testPanelAndChromeControlsAreReachable               -only-testing:LoweyUITests/LayoutTests/testMakingControlsAreReachable \
              -only-testing:LoweyUITests/LayoutTests/testModelControlsAreReachable \
              -only-testing:LoweyUITests/LayoutTests/testMoreModelControlsAreReachable \
              -only-testing:LoweyUITests/LayoutTests/testSelectionControlsAreReachable \
              -only-testing:LoweyUITests/LayoutTests/testTimelineControlsAreReachable \
              CODE_SIGNING_ALLOWED=NO | tee appstore.log | grep -E "error:|failed|Test Case|Executed|\*\* " || true
            grep -q "\*\* TEST SUCCEEDED \*\*" appstore.log && exit 0
            echo "::warning::The App Store walk failed on attempt $attempt"
          done
          exit 1
      - name: The App Store build holds the list and is iPad only; Debug holds nothing
        run: |
          PLIST=$(find DerivedData/Build/Products -path "*AppStore-iphonesimulator/*.app/Info.plist" -maxdepth 4 | head -1)
          test -n "$PLIST" || { echo "::error::No App Store build found"; exit 1; }
          HELD=$(/usr/libexec/PlistBuddy -c "Print :HmmHeld" "$PLIST" 2>/dev/null || true)
          WANT=$(python3 Tools/check_held.py)
          test "$HELD" = "$WANT" || { echo "::error::The App Store build holds '$HELD', not '$WANT'"; exit 1; }
          FAMILY=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$PLIST" | tr -d '[:space:]')
          echo "$FAMILY" | grep -q "^Array{2}$" || { echo "::error::The App Store build's devices are $FAMILY, not the iPad alone"; exit 1; }
          echo "The App Store build ($PLIST) holds: $HELD"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appstore-log
          path: appstore.log
          retention-days: 7

  result:
    name: CI result
    needs: [changes, lint, core-tests, interop, threejs, godot, look-shader, tools, engine, features, app, ui, appstore]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything that had to run passed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          for name, job in needs.items():
              print(name + ": " + job["result"])
          sys.exit(1 if bad else 0)'
